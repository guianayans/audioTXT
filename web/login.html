<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>audioTXT — Entrar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%99%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/app.css?v=11" />
</head>
<body class="login-body">
  <form class="login-card" id="loginForm">
    <div class="brand login-brand">
      <div class="brand-mark">◉</div>
      <h1>audio<span>TXT</span></h1>
    </div>
    <p class="muted login-sub">Transcrição de áudio local · Whisper · GPU</p>
    <label class="field"><span>Senha de acesso</span>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" autofocus /></label>
    <button class="btn-primary login-btn" type="submit">Entrar</button>
    <p class="login-error" id="error"></p>
    <p class="muted tiny">A senha é definida nas variáveis do Coolify (<code>AUDIOTXT_PASSWORD</code>).</p>
  </form>
<script>
const form=document.getElementById('loginForm'), err=document.getElementById('error');
form.addEventListener('submit', async (e)=>{ e.preventDefault(); err.textContent='';
  const fd=new FormData(); fd.append('password', document.getElementById('password').value);
  const r=await fetch('/api/login',{method:'POST',body:fd});
  if(r.ok){ location.href='/'; }
  else{ const j=await r.json().catch(()=>({})); err.textContent=j.error||'Falha ao entrar';
    form.classList.add('shake'); setTimeout(()=>form.classList.remove('shake'),500); } });
</script>
</body>
</html>
